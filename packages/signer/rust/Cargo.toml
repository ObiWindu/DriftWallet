[package]
name = "drift-signer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DriftWallet trusted signer core — ONLY place handling seeds"

[lib]
name = "drift_signer"
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = { version = "2.2", features = ["rand"] }
zeroize = { version = "1.8", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256", "schnorr"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
blake2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
wasm-bindgen = "0.2"
bs58 = "0.5"
bech32 = "0.11"
bip32 = { version = "0.5", features = ["secp256k1"] }
ed25519-bip32 = "0.4"

[dev-dependencies]
hex-literal = "0.4"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
cardano-serialization-lib = "13"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
