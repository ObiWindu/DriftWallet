rules:
  - id: no-store-secrets
    languages: [typescript, javascript]
    severity: ERROR
    message: "Do not persist sessionId / seed material to cleartext stores. Use chrome.storage.session (extension) or Keychain/Keystore-backed encrypted storage (mobile)."
    pattern-either:
      # sessionId into persistent web stores
      - pattern: localStorage.setItem(..., $S, ...)
        metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: (?i)(sessionId|mnemonic|seed|privateKey|entropy|\bdek\b)
      - pattern: sessionStorage.setItem(..., $S, ...)
        metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: (?i)(sessionId|mnemonic|seed|privateKey|entropy|\bdek\b)
      - pattern: chrome.storage.local.set(...)
      - pattern: $MMKV.set(..., $S, ...)
        metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: (?i)(sessionId|mnemonic|seed|privateKey|entropy|\bdek\b)
      - pattern-regex: (?i)(localStorage|chrome\.storage\.local|mmkv)\s*[.\[].*(sessionId|mnemonic|privateKey)
    paths:
      exclude:
        # chrome.storage.session is the approved in-memory session holder
        - "*session-store*"
    fix: "Store only opaque session handles in chrome.storage.session (memory-only); never localStorage/MMKV/chrome.storage.local."
