rules:
  - id: no-secret-log
    languages: [typescript, javascript]
    severity: ERROR
    message: "Do not log secrets (mnemonic/seed/privateKey/password)"
    pattern-either:
      - pattern: console.log(..., $X, ...)
        metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-regex: (?i)(mnemonic|seed|private.?key|password|\bdek\b)
      - pattern-regex: (?i)(mnemonic|privateKey|seedPhrase)\s*[:=]
